# Regenerates the public template repo from create-design-hub on every push to
# main, so "Use this template" on GitHub gives the same thin project `npm
# create design-hub` does. Needs a TEMPLATE_REPO_TOKEN secret with write access
# to the template repo.
name: template
on:
  push:
    branches: [main]
    paths:
      - 'packages/create-design-hub/**'
      - 'packages/design-hub/package.json'
      - 'packages/design-hub/skills/**'
jobs:
  publish-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the project
        run: node packages/create-design-hub/index.mjs --path "$RUNNER_TEMP/design-hub-template" --visibility none --link "$PWD/packages/design-hub"
      - name: Point the project at the published package
        run: |
          cd "$RUNNER_TEMP/design-hub-template"
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const { version } = JSON.parse(fs.readFileSync(process.env.HUB + "/package.json", "utf8"));
            pkg.dependencies["@milesroxas/design-hub"] = "^" + version;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          rm -rf node_modules pnpm-lock.yaml .git
        env:
          HUB: ${{ github.workspace }}/packages/design-hub
      - name: Push to the template repo
        env:
          TOKEN: ${{ secrets.TEMPLATE_REPO_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/design-hub-template"
          git init -b main
          git config user.name "design-hub[bot]"
          git config user.email "design-hub@users.noreply.github.com"
          git add -A
          git commit -q -m "Template from design-hub ${{ github.sha }}"
          git push --force "https://x-access-token:${TOKEN}@github.com/milesroxas/design-hub-template.git" main
