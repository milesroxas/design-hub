# Regenerates the public template repo from create-design-hub on every push to
# main, so "Use this template" on GitHub gives the same thin project `npm
# create @milesroxas/design-hub` does. The push needs a TEMPLATE_DEPLOY_KEY
# secret: the private half of a write deploy key on
# milesroxas/design-hub-template, so it can touch no other repo. Without it the
# run still generates the project (so the scaffolder is exercised) and skips
# the push.
name: template
on:
  push:
    branches: [main]
    paths:
      - 'packages/create-design-hub/**'
      - 'packages/design-hub/package.json'
      - 'packages/design-hub/skills/**'
      - '.github/workflows/template.yml'
  workflow_dispatch:
jobs:
  publish-template:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.TEMPLATE_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the project
        run: node packages/create-design-hub/index.mjs --path "$RUNNER_TEMP/design-hub-template" --visibility none --link "$PWD/packages/design-hub"
      - name: Point the project at the published package
        run: |
          cd "$RUNNER_TEMP/design-hub-template"
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const { version } = JSON.parse(fs.readFileSync(process.env.HUB + "/package.json", "utf8"));
            pkg.dependencies["@milesroxas/design-hub"] = "^" + version;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          rm -rf node_modules pnpm-lock.yaml .git
        env:
          HUB: ${{ github.workspace }}/packages/design-hub
      - name: Skip the push without a key
        if: env.HAS_KEY != 'true'
        run: echo "::notice::TEMPLATE_DEPLOY_KEY is not set; generated the project but did not push it."
      - name: Push to the template repo
        if: env.HAS_KEY == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.TEMPLATE_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          cd "$RUNNER_TEMP/design-hub-template"
          git init -b main
          git config user.name "design-hub[bot]"
          git config user.email "design-hub@users.noreply.github.com"
          git add -A
          git commit -q -m "Template from design-hub ${{ github.sha }}"
          git push --force git@github.com:milesroxas/design-hub-template.git main
